<!DOCTYPE html>
<html lang="pt-BR" style="color-scheme: light;">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <!--
    AdSense recomenda CSP com nonce por requisição. Como este SPA é estático,
    usamos uma política HTTPS mais permissiva para permitir adsbygoogle e criativos
    externos sem manter allowlist frágil de domínios que mudam com o tempo.
  -->

  <script src="/turnstile-patch.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <title>Dezzapego</title>
  <!-- canonical e og:url: domínio injetado no build via VITE_SITE_URL -->
  <link rel="canonical" href="%SITE_ORIGIN%/" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="color-scheme" content="light" />
  <meta name="description"
    content="Imóveis, carros, eletrônicos e mais. Publique anúncios grátis no Dezzapego." />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="Dezzapego" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Dezzapego" />
  <meta property="og:description"
    content="Imóveis, carros, eletrônicos e mais. Publique anúncios grátis no Dezzapego." />
  <meta property="og:url" content="%SITE_ORIGIN%/" />
  <meta property="og:image" content="%SITE_ORIGIN%/og-default.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
